<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ML4T Exam Trainer</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#18181b;--muted:#71717a;--line:#e7e5e0;--accent:#4f46e5;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--panel:#1a1a1d;--ink:#f4f4f5;--muted:#a1a1aa;--line:#2a2a2e;--accent:#8b8cff;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;padding:16px}
.box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
input[type=password]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font:inherit;outline:none}
input[type=password]:focus{border-color:var(--accent)}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:12px 0 16px}
button{width:100%;padding:11px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-weight:650;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>
<form class="box" id="f">
  <div class="logo">ML</div>
  <h1>ML4T Exam Trainer</h1>
  <p>Enter the password to open the app.</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
  <label><input type="checkbox" id="rem" checked> Remember on this device</label>
  <button id="go">Unlock</button>
  <div class="err" id="err"></div>
</form>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(D.salt),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const z=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.iv)},key,ub(D.ct));
  const html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
  document.open(); document.write(html); document.close();
}
const K='ml4t-lock-pw';
const f=document.getElementById('f'), err=document.getElementById('err'), btn=document.getElementById('go');
f.onsubmit=async e=>{
  e.preventDefault(); err.textContent=''; btn.disabled=true; btn.textContent='Unlocking…';
  const pw=document.getElementById('pw').value, rem=document.getElementById('rem').checked;
  try{ await unlock(pw); try{ if(rem) localStorage.setItem(K,pw); }catch(_){} }
  catch(_){ btn.disabled=false; btn.textContent='Unlock'; err.textContent='Wrong password. Try again.'; }
};
(async()=>{ let saved=null; try{ saved=localStorage.getItem(K); }catch(_){}
  if(saved){ try{ await unlock(saved); }catch(_){ try{ localStorage.removeItem(K); }catch(__){} } } })();
</script>
